<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KELAS PAK ARIF - Bab 2: Berpikir Komputasional</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0B2D5B',
                        cardBg: '#123B6B',
                        primary: '#00C2FF',
                        secondary: '#0A84FF',
                        accent: '#c084fc'
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body { background-color: #0B2D5B; color: #f8fafc; font-family: 'Inter', sans-serif; overflow-x: hidden; }
        .glass-card { background: rgba(18, 59, 107, 0.75); backdrop-filter: blur(10px); border: 1px solid rgba(0, 194, 255, 0.2); border-radius: 1rem; }
        .text-gradient { background: linear-gradient(to right, #00C2FF, #0A84FF); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        const PetaKonsep = () => (
            <div className="animate-fade-in">
                <h2 className="text-3xl font-bold mb-2 text-gradient"><i className="fas fa-sitemap mr-2"></i> Peta Konsep</h2>
                <p className="text-slate-300 mb-8">Gambaran hierarki materi Algoritma dan Pemrograman.</p>
            </div>
        );

        const App = () => {
            const [activeMenu, setActiveMenu] = useState('peta');
            const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);

            const navItems = [
                { id: 'home', icon: 'fa-home', label: 'Beranda Utama', isExternal: true, link: '/' },
                { id: 'peta', icon: 'fa-sitemap', label: 'Peta Konsep' },
            ];

            return (
                <div className="min-h-screen flex flex-col md:flex-row relative">
                    <div className="md:hidden bg-slate-900/90 p-4 flex justify-between items-center sticky top-0 z-50 border-b border-slate-800">
                        <div className="flex items-center space-x-2">
                            <div className="w-8 h-8 bg-slate-800 p-1 rounded-lg border border-primary/30 flex items-center justify-center">
                                <img src="https://lh3.googleusercontent.com/d/1pOJ2wlrwqc8HRX_-euZZPhE8Bvn9ipCH" alt="Logo" class="w-full h-full object-contain">
                            </div>
                            <span className="font-bold text-sm text-gradient">KELAS PAK ARIF</span>
                        </div>
                        <button onClick={() => setIsMobileMenuOpen(!isMobileMenuOpen)} className="text-white p-2">
                            <i className={`fas ${isMobileMenuOpen ? 'fa-times' : 'fa-bars'}`}></i>
                        </button>
                    </div>

                    <nav className={`${isMobileMenuOpen ? 'block' : 'hidden'} md:block w-full md:w-64 bg-slate-900/95 border-r border-slate-800 md:h-screen md:sticky md:top-0 z-40`}>
                        <div className="p-6 hidden md:block border-b border-slate-800">
                            <div className="flex items-center space-x-3 mb-2">
                                <div className="w-10 h-10 bg-slate-800 p-1 rounded-xl border border-primary/30 flex items-center justify-center shadow">
                                    <img src="https://lh3.googleusercontent.com/d/1pOJ2wlrwqc8HRX_-euZZPhE8Bvn9ipCH" alt="Logo" class="w-full h-full object-contain">
                                </div>
                                <h1 className="font-bold text-base text-gradient leading-tight">KELAS PAK ARIF</h1>
                            </div>
                            <p className="text-[10px] text-cyan-400 font-mono tracking-widest uppercase">Informatika Kelas IX</p>
                        </div>
                        <ul className="flex flex-col py-4 px-3 space-y-1">
                            {navItems.map(item => (
                                <li key={item.id}>
                                    <button 
                                        onClick={() => {
                                            if(item.isExternal) { window.location.href = item.link; }
                                            else { setActiveMenu(item.id); setIsMobileMenuOpen(false); }
                                        }}
                                        className={`w-full text-left px-4 py-3 rounded-xl transition-all flex items-center text-xs font-semibold ${activeMenu === item.id && !item.isExternal ? 'bg-primary/20 text-primary shadow-[inset_4px_0_0_0_#00C2FF]' : 'text-slate-300 hover:bg-slate-800 hover:text-white'}`}
                                    >
                                        <i className={`fas ${item.icon} w-6 text-center mr-2 text-sm`}></i> {item.label}
                                    </button>
                                </li>
                            ))}
                        </ul>
                    </nav>

                    <main className="flex-1 p-6 md:p-10 lg:p-12 min-h-screen flex flex-col justify-between">
                        <div className="max-w-5xl mx-auto w-full"><PetaKonsep /></div>
                        <footer className="max-w-5xl mx-auto w-full mt-24 pt-8 border-t border-slate-800 text-center text-slate-400 text-xs space-y-1">
                            <p className="font-bold text-slate-300">Arif Nur Hidayat, S.Pd. | Guru Informatika SMPN 57 Surabaya</p>
                            <p className="text-[10px] font-mono text-cyan-400 tracking-wider">BELAJAR • BERBAGI • BERKEMBANG</p>
                        </footer>
                    </main>
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
